<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <title>EmployeeHub Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand"
           th:href="@{/dashboard}">
            EmployeeHub
        </a>

        <div class="ms-auto">

            <a th:href="@{/employees}"
               class="btn btn-outline-light me-2">
                Employees
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline;">

                <button class="btn btn-danger">
                    Logout
                </button>

            </form>

        </div>

    </div>
</nav>


<div class="container mt-5">

    <h1 class="mb-4">
        Dashboard
    </h1>

    <div class="row">

        <!-- Employee Management -->
        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h5 class="card-title">
                        Employee Management
                    </h5>

                    <p class="card-text">
                        View, search, edit and manage employees.
                    </p>

                    <a th:href="@{/employees}"
                       class="btn btn-primary">
                        Open
                    </a>

                </div>

            </div>

        </div>

        <!-- Add Employee -->
        <div class="col-md-4"
             sec:authorize="hasRole('ADMIN')">

            <div class="card shadow">

                <div class="card-body">

                    <h5 class="card-title">
                        Add Employee
                    </h5>

                    <p class="card-text">
                        Register a new employee.
                    </p>

                    <a th:href="@{/employees/new}"
                       class="btn btn-success">
                        Add
                    </a>

                </div>

            </div>

        </div>

        <!-- Statistics -->
        <div class="row mt-4">

            <div class="col-md-4">

                <div class="card bg-primary text-white">

                    <div class="card-body">

                        <h5>Total Employees</h5>

                        <h2 th:text="${employeeCount}"></h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card bg-success text-white">

                    <div class="card-body">

                        <h5>Departments</h5>

                        <h2 th:text="${departmentCount}"></h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card bg-warning text-dark">

                    <div class="card-body">

                        <h5>Average Salary</h5>

                        <h2 th:text="${averageSalary}"></h2>

                    </div>

                </div>

            </div>

        </div>

        <h3 class="mt-5">Employees by Department</h3>

        <canvas id="departmentChart"></canvas>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">

    const departmentLabels = [
        /*[# th:each="stat : ${departmentStats}"]*/
        [[${stat.department}]],
        /*[/]*/
    ];

    const employeeCounts = [
        /*[# th:each="stat : ${departmentStats}"]*/
        [[${stat.employeeCount}]],
        /*[/]*/
    ];

</script>
<script>

    const ctx = document.getElementById('departmentChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: departmentLabels,
            datasets: [{
                label: 'Employees',
                data: employeeCounts,
                backgroundColor: [
                    '#0d6efd',
                    '#198754',
                    '#dc3545',
                    '#ffc107',
                    '#6f42c1',
                    '#20c997'
                ]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });

</script>
</body>
</html>
