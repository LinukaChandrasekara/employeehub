<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Employee</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1>Add Employee</h1>


    <form th:action="@{/employees/{id}(id=${employee.id})}"
          th:object="${employee}"
          method="post">

        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label>First Name</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{firstName}">
        </div>


        <div class="mb-3">
            <label>Last Name</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{lastName}">
        </div>


        <div class="mb-3">
            <label>Email</label>

            <input
                    type="email"
                    class="form-control"
                    th:field="*{email}">
        </div>


        <div class="mb-3">
            <label>Department</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{department}">
        </div>


        <div class="mb-3">
            <label>Salary</label>

            <input
                    type="number"
                    class="form-control"
                    th:field="*{salary}">
        </div>


        <button class="btn btn-success">
            Save Employee
        </button>


    </form>

</div>

</body>
</html>
