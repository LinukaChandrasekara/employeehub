<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Error | EmployeeHub</title>


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <style>


        body {

            min-height:100vh;

            background:
            linear-gradient(135deg,#667eea,#764ba2);

            display:flex;

            align-items:center;

            justify-content:center;

            font-family:'Segoe UI',sans-serif;

        }



        .error-card {

            width:500px;

            background:white;

            padding:40px;

            border-radius:20px;

            text-align:center;

            box-shadow:
            0 20px 40px rgba(0,0,0,.2);

        }



        .error-icon {

            font-size:70px;

            color:#dc3545;

            margin-bottom:20px;

        }



        .error-title {

            font-size:32px;

            font-weight:700;

            color:#4b3f72;

        }



        .error-message {

            color:#666;

            font-size:16px;

            margin:20px 0;

        }



        .back-btn {

            background:
            linear-gradient(135deg,#667eea,#764ba2);

            border:none;

            border-radius:10px;

            padding:12px 25px;

            font-weight:600;

        }



        .back-btn:hover {

            transform:translateY(-2px);

            box-shadow:
            0 8px 15px rgba(102,126,234,.35);

        }



    </style>


</head>



<body>



<div class="error-card">



    <div class="error-icon">

        <i class="bi bi-exclamation-triangle-fill"></i>

    </div>



    <h2 class="error-title">

        Oops!

    </h2>



    <p class="error-message"
       th:text="${errorMessage}">

    </p>





    <a th:href="@{/employees}"
       class="btn btn-primary back-btn">


        <i class="bi bi-arrow-left-circle"></i>

        Back to Employee List


    </a>



</div>



</body>

</html>
