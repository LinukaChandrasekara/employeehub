<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Employee</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1>Edit Employee</h1>


    <form th:action="@{/employees/{id}(id=${employee.id})}"
          th:object="${employee}"
          method="post">

        <div class="mb-3">
            <label>First Name</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{firstName}">
            <div class="text-danger"
                 th:errors="*{firstName}">
            </div>
        </div>


        <div class="mb-3">
            <label>Last Name</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{lastName}">
            <div class="text-danger"
                 th:errors="*{lastName}">
            </div>
        </div>


        <div class="mb-3">
            <label>Email</label>

            <input
                    type="email"
                    class="form-control"
                    th:field="*{email}">
            <div class="text-danger"
                 th:errors="*{email}">
            </div>

        </div>
        <div class="mb-3">
            <label>Phone</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{phone}">

            <div class="text-danger"
                 th:errors="*{phone}">
            </div>
        </div>
        <div class="mb-3">
            <label>Position</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{position}">

            <div class="text-danger"
                 th:errors="*{position}">
            </div>
        </div>


        <div class="mb-3">
            <label>Department</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{department}">
            <div class="text-danger"
                 th:errors="*{department}">
            </div>
        </div>


        <div class="mb-3">
            <label>Salary</label>

            <input
                    type="number"
                    class="form-control"
                    th:field="*{salary}">
            <div class="text-danger"
                 th:errors="*{salary}">
            </div>
        </div>
        <div class="mb-3">
            <label>Hire Date</label>

            <input
                    type="date"
                    class="form-control"
                    th:field="*{hireDate}">
        </div>


        <button type="submit" class="btn btn-success">
            Save Employee
        </button>


    </form>

</div>

</body>
</html>
