<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <title>Add Employee | EmployeeHub</title>


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">



    <style>


        body {

            background:#f4f6fb;

            font-family:'Segoe UI',sans-serif;

        }



        .form-container {

            max-width:900px;

            margin:auto;

            background:white;

            padding:35px;

            border-radius:20px;

            box-shadow:
            0 10px 30px rgba(0,0,0,.1);

        }



        .page-title {

            font-weight:700;

            color:#4b3f72;

        }



        .form-label {

            font-weight:600;

            color:#444;

        }



        .form-control {

            border-radius:10px;

            height:45px;

        }



        .form-control:focus {

            border-color:#667eea;

            box-shadow:
            0 0 0 .2rem rgba(102,126,234,.25);

        }



        .save-btn {

            background:
            linear-gradient(135deg,#667eea,#764ba2);

            border:none;

            border-radius:10px;

            padding:12px 30px;

            font-weight:600;

            transition:.3s;

        }



        .save-btn:hover {

            transform:translateY(-2px);

            box-shadow:
            0 8px 15px rgba(102,126,234,.35);

        }



        .section-icon {

            color:#667eea;

        }


    </style>


</head>


<body>



<div th:replace="~{fragments/navbar :: navbar}"></div>





<div class="container mt-5 mb-5">


    <div class="form-container">



        <h1 class="page-title mb-4">

            <i class="bi bi-person-plus section-icon"></i>

            Add Employee

        </h1>





        <form th:action="@{/employees}"
              th:object="${employee}"
              method="post">





            <div class="row">



                <div class="col-md-6">


                    <div class="mb-3">

                        <label class="form-label">
                            First Name
                        </label>


                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter first name"
                                th:field="*{firstName}">


                        <div class="text-danger"
                             th:errors="*{firstName}">
                        </div>


                    </div>


                </div>





                <div class="col-md-6">


                    <div class="mb-3">

                        <label class="form-label">
                            Last Name
                        </label>


                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter last name"
                                th:field="*{lastName}">


                        <div class="text-danger"
                             th:errors="*{lastName}">
                        </div>


                    </div>


                </div>





                <div class="col-md-6">


                    <div class="mb-3">


                        <label class="form-label">
                            Email
                        </label>


                        <input
                                type="email"
                                class="form-control"
                                placeholder="Enter email address"
                                th:field="*{email}">


                        <div class="text-danger"
                             th:errors="*{email}">
                        </div>


                    </div>


                </div>






                <div class="col-md-6">


                    <div class="mb-3">


                        <label class="form-label">
                            Phone
                        </label>


                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter phone number"
                                th:field="*{phone}">


                        <div class="text-danger"
                             th:errors="*{phone}">
                        </div>


                    </div>


                </div>






                <div class="col-md-6">


                    <div class="mb-3">


                        <label class="form-label">
                            Position
                        </label>


                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter job position"
                                th:field="*{position}">


                        <div class="text-danger"
                             th:errors="*{position}">
                        </div>


                    </div>


                </div>






                <div class="col-md-6">


                    <div class="mb-3">


                        <label class="form-label">
                            Department
                        </label>


                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter department"
                                th:field="*{department}">


                        <div class="text-danger"
                             th:errors="*{department}">
                        </div>


                    </div>


                </div>






                <div class="col-md-6">


                    <div class="mb-3">


                        <label class="form-label">
                            Salary
                        </label>


                        <input
                                type="number"
                                class="form-control"
                                placeholder="Enter salary"
                                th:field="*{salary}">


                        <div class="text-danger"
                             th:errors="*{salary}">
                        </div>


                    </div>


                </div>






                <div class="col-md-6">


                    <div class="mb-3">


                        <label class="form-label">
                            Hire Date
                        </label>


                        <input
                                type="date"
                                class="form-control"
                                th:field="*{hireDate}">


                    </div>


                </div>



            </div>






            <div class="mt-3">


                <button
                        type="submit"
                        class="btn btn-success save-btn">


                    <i class="bi bi-check-circle"></i>

                    Save Employee


                </button>



                <a th:href="@{/employees}"
                   class="btn btn-outline-secondary ms-2">

                    Cancel

                </a>


            </div>





        </form>



    </div>



</div>



</body>

</html>
