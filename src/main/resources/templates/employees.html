<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>EmployeeHub</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        Employee List
    </h1>
    <a th:href="@{/employees/new}" class="btn btn-primary mb-3">
        Add Employee
    </a>

    <table class="table table-bordered">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="employee : ${employees}">

            <td th:text="${employee.id}"></td>

            <td>
                <span th:text="${employee.firstName}"></span>
                <span th:text="${employee.lastName}"></span>
            </td>

            <td th:text="${employee.email}"></td>

            <td th:text="${employee.department}"></td>

            <td>

                <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>


                <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
