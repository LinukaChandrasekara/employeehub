<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>EmployeeHub Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <style>

        body {

            min-height: 100vh;

            background:
            linear-gradient(135deg,
            #667eea 0%,
            #764ba2 100%);

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Segoe UI', sans-serif;

        }


        .login-card {

            width: 420px;

            border-radius: 20px;

            background: rgba(255,255,255,0.95);

            backdrop-filter: blur(10px);

            box-shadow:
            0 20px 40px rgba(0,0,0,0.2);

            padding: 35px;

        }


        .logo-image {

            width: 120px;

            height: 120px;

            object-fit: contain;

            display: block;

            margin: 0 auto 15px;

        }


        .brand-title {

            font-size: 32px;

            font-weight: 700;

            color: #4b3f72;

        }


        .brand-subtitle {

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        .form-control {

            height: 45px;

            border-radius: 10px;

        }


        .form-control:focus {

            border-color: #667eea;

            box-shadow:
            0 0 0 .2rem rgba(102,126,234,.25);

        }


        .login-btn {

            height: 45px;

            border-radius: 10px;

            background:
            linear-gradient(135deg,#667eea,#764ba2);

            border: none;

            font-weight: 600;

            transition: .3s;

        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
            0 8px 15px rgba(102,126,234,.4);

        }


        .input-group-text {

            background: transparent;

            border-right: none;

        }


        .input-group .form-control {

            border-left: none;

        }


    </style>


</head>


<body>


<div class="login-card">


    <!-- Professional employee illustration -->
    <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            class="logo-image"
            alt="Employee">


    <h2 class="text-center brand-title">
        EmployeeHub
    </h2>


    <p class="text-center brand-subtitle">
        Employee Management System
    </p>



    <div th:if="${param.error}"
         class="alert alert-danger text-center">

        <i class="bi bi-exclamation-triangle"></i>
        Invalid username or password

    </div>



    <div th:if="${param.logout}"
         class="alert alert-success text-center">

        <i class="bi bi-check-circle"></i>
        You have been logged out

    </div>



    <form th:action="@{/login}"
          method="post">



        <div class="mb-3">


            <label class="form-label">
                Username
            </label>


            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>


                <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username">

            </div>


        </div>





        <div class="mb-3">


            <label class="form-label">
                Password
            </label>


            <div class="input-group">


                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>


                <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password">


            </div>


        </div>





        <button
                class="btn btn-primary w-100 login-btn">

            <i class="bi bi-box-arrow-in-right"></i>
            Login

        </button>



    </form>


</div>


</body>

</html>
