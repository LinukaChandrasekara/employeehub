<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>

    <title>EmployeeHub Dashboard</title>


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <style>


        body {

            background:#f4f6fb;

            font-family:'Segoe UI',sans-serif;

        }



        .navbar {

            background:
            linear-gradient(135deg,#667eea,#764ba2);

            box-shadow:
            0 5px 20px rgba(0,0,0,.15);

        }



        .navbar-brand {

            font-size:26px;

            font-weight:700;

        }



        .dashboard-title {

            font-weight:700;

            color:#343a40;

        }



        .dashboard-card {

            border:none;

            border-radius:18px;

            box-shadow:
            0 10px 25px rgba(0,0,0,.08);

            transition:.3s;

        }



        .dashboard-card:hover {

            transform:translateY(-5px);

        }



        .stat-card {

            border-radius:18px;

            border:none;

            box-shadow:
            0 8px 20px rgba(0,0,0,.12);

        }



        .chart-card {

            background:white;

            border-radius:18px;

            padding:20px;

            box-shadow:
            0 8px 20px rgba(0,0,0,.08);

            height:350px;

        }



        canvas {

            max-height:270px;

        }



        .table {

            background:white;

            border-radius:15px;

            overflow:hidden;

        }



    </style>


</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">


        <a class="navbar-brand"
           th:href="@{/dashboard}">

            <i class="bi bi-people-fill"></i>
            EmployeeHub

        </a>



        <div class="ms-auto">


            <a th:href="@{/employees}"
               class="btn btn-outline-light me-2">

                <i class="bi bi-person-lines-fill"></i>
                Employees

            </a>



            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline;">


                <button class="btn btn-danger">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </button>


            </form>


        </div>


    </div>


</nav>





<div class="container mt-5">



    <h1 class="dashboard-title mb-4">

        <i class="bi bi-speedometer2"></i>
        Dashboard

    </h1>





    <!-- Main Actions -->

    <div class="row g-4">



        <div class="col-md-4">


            <div class="card dashboard-card">

                <div class="card-body">


                    <h5>

                        <i class="bi bi-people"></i>
                        Employee Management

                    </h5>


                    <p class="text-muted">

                        View, search, edit and manage employees.

                    </p>



                    <a th:href="@{/employees}"
                       class="btn btn-primary">

                        Open

                    </a>


                </div>

            </div>


        </div>





        <div class="col-md-4"
             sec:authorize="hasRole('ADMIN')">


            <div class="card dashboard-card">


                <div class="card-body">


                    <h5>

                        <i class="bi bi-person-plus"></i>
                        Add Employee

                    </h5>


                    <p class="text-muted">

                        Register a new employee.

                    </p>


                    <a th:href="@{/employees/new}"
                       class="btn btn-success">

                        Add

                    </a>


                </div>


            </div>


        </div>



    </div>






    <!-- Statistics -->


    <div class="row mt-4 g-4">


        <div class="col-md-4">


            <div class="card stat-card bg-primary text-white">


                <div class="card-body">

                    <h5>
                        Total Employees
                    </h5>

                    <h2 th:text="${employeeCount}"></h2>

                </div>


            </div>


        </div>





        <div class="col-md-4">


            <div class="card stat-card bg-success text-white">


                <div class="card-body">

                    <h5>
                        Departments
                    </h5>

                    <h2 th:text="${departmentCount}"></h2>


                </div>


            </div>


        </div>





        <div class="col-md-4">


            <div class="card stat-card bg-warning">


                <div class="card-body">


                    <h5>
                        Average Salary
                    </h5>


                    <h2 th:text="${averageSalary}"></h2>


                </div>


            </div>


        </div>



    </div>








    <!-- Charts -->

    <div class="row mt-5 g-4">


        <div class="col-md-6">


            <div class="chart-card">


                <h5 class="mb-3">

                    <i class="bi bi-bar-chart"></i>
                    Employees By Department

                </h5>


                <canvas id="departmentChart"></canvas>


            </div>


        </div>





        <div class="col-md-6">


            <div class="chart-card">


                <h5 class="mb-3">

                    <i class="bi bi-pie-chart"></i>
                    Salary Distribution

                </h5>


                <canvas id="salaryChart"></canvas>


            </div>


        </div>


    </div>









    <h3 class="mt-5 mb-3">

        <i class="bi bi-person-check"></i>
        Recent Hires

    </h3>





    <table class="table table-bordered shadow-sm">


        <thead class="table-dark">


        <tr>

            <th>Name</th>

            <th>Department</th>

            <th>Hire Date</th>

        </tr>


        </thead>




        <tbody>


        <tr th:each="employee : ${recentEmployees}">


            <td>

                <span th:text="${employee.firstName}"></span>

                <span th:text="${employee.lastName}"></span>

            </td>


            <td th:text="${employee.department}"></td>


            <td th:text="${employee.hireDate}"></td>


        </tr>


        </tbody>


    </table>




</div>





<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">

    const departmentLabels = [
        /*[# th:each="stat : ${departmentStats}"]*/
        [[${stat.department}]],
        /*[/]*/
    ];

    const employeeCounts = [
        /*[# th:each="stat : ${departmentStats}"]*/
        [[${stat.employeeCount}]],
        /*[/]*/
    ];

</script>
<script>

    const ctx = document.getElementById('departmentChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: departmentLabels,
            datasets: [{
                label: 'Employees',
                data: employeeCounts,
                backgroundColor: [
                    '#0d6efd',
                    '#198754',
                    '#dc3545',
                    '#ffc107',
                    '#6f42c1',
                    '#20c997'
                ]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });

</script>
<script th:inline="javascript">

    const salaryLabels = [
        /*[# th:each="stat : ${salaryStats}"]*/
        [[${stat.range}]],
        /*[/]*/
    ];

    const salaryCounts = [
        /*[# th:each="stat : ${salaryStats}"]*/
        [[${stat.employeeCount}]],
        /*[/]*/
    ];

</script>
<script>

    const salaryCtx = document.getElementById('salaryChart');

    new Chart(salaryCtx, {
        type: 'pie',

        data: {
            labels: salaryLabels,

            datasets: [{
                label: 'Employees',

                data: salaryCounts,

                backgroundColor: [
                    '#0d6efd',
                    '#198754',
                    '#ffc107',
                    '#dc3545'
                ]
            }]
        },

        options: {
            responsive: true
        }
    });

</script>

</body>

</html>
